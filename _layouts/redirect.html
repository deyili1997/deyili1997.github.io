<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | absolute_url }}">
  <script>
    window.location.replace({{ page.redirect_to | relative_url | jsonify }} + window.location.search + window.location.hash);
  </script>
</head>
<body>
  <h1>{{ page.title | escape }}</h1>
  <p>This page has moved to <a href="{{ page.redirect_to | relative_url }}">{{ page.title | escape }}</a>.</p>
</body>
</html>
