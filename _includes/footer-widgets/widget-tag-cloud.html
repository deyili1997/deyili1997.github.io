{% if site.tags.size >= 1 %}
<div class="col col-4 col-d-6 col-t-12">
  <div class="widget widget-tag-cloud">
    <div class="widget__head">
      <h3 class="widget__title">Explore Tags</h3>
    </div>
    <div class="tag__cloud">
    {% assign tagged_items = site.posts | concat: site.causal_inference %}
    {% assign sorted_tags = tagged_items | map: 'tags' | join: ',' | split: ',' | uniq | sort %}
    {% for tag in sorted_tags %}
      <a href="{{ site.baseurl }}/tags/?tag={{ tag | downcase | url_encode }}">{{ tag }}</a>
    {% endfor %}
    </div>
  </div>
</div>
{% endif %}
